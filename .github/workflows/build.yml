
name: Build C Project APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Flutter project folder
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "cend_dolphin/pubspec.yaml" ]; then
            echo "PROJECT_DIR=cend_dolphin" >> "$GITHUB_ENV"
          else
            echo "::error::pubspec.yaml not found in repository root or cend_dolphin/"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter doctor -v
          flutter pub get

      - name: Generate Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter create \
            --platforms=android \
            --org=com.cproject \
            --project-name=cend_dolphin \
            .

      - name: Apply Android configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f "tool/patch_android.py" ]; then
            python3 tool/patch_android.py
          else
            echo "::error::tool/patch_android.py not found"
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-project-debug-apk
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
          retention-days: 7
          
